# reusable ESM — host-visible names stay
[javascript]
assume_pure_property_reads = true
# The tokenizer's state functions (and the lambdas of the builders around
# it) are called by micromark's engine and by extensions; nothing constructs
# them or reads their prototype, as nothing does upstream's.
assume_unconstructed_callbacks = true
priority = "size-first"
# 8.90: level 13 -> 15, measured -70 Brotli on this port's own
# artifact. Swept across the fleet the level is nearly inert (-160 over 22,
# and katexlil and react-markdownlil do not move at all), so it lands per
# port where it pays rather than as a default.
optimization_level = 15

cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
candidate_search = "always"

[mangle]
identifiers = true
properties = true
pool_strings = true
