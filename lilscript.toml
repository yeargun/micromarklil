# Compiler-owned delivery; no JavaScript post-minifier or export rewriting.
[policy]
version = 3

[policy.tactics]
# Permit one-time constant-table decoding for smaller downloads.
# Runtime reads must not acquire recurring reconstruction work.
startup-reconstruction = "on"
recurring-reconstruction = "off"
string-array-packing = "off"
[javascript]
# Plain-data reads must not run getters; disable for effectful accessor integrations.
assume_pure_property_reads = true
assume_unconstructed_callbacks = true
priority = "size-first"
# Assumes unpatched platform builtins; disable when consumers replace them.
assume_pristine_builtins = true
# Remove debugLog instrumentation; ordinary print and host console effects remain.
strip_debug = true

# Preserved effort setting. 13 favors size; 14/15 allow more expensive marginal searches.
[effort]
level = 15

# Optimize the delivered files for this codec, independently of raw/gzip objectives.
[objective]
codecs = "brotli"
[mangle]
identifiers = true
properties = true
pool_strings = true

[delivery]
mode = "single"
directory = "."
select = ["micromark"]
entry_names = "micromark.esm.js"
[delivery.entries]
micromark = "src/index.lil"
stream = "src/stream.lil"
browser = "src/browser.lil"
test = "test/support.lil"
[[delivery.also]]
name = "cjs"
format = "cjs"
entries = ["micromark"]
es_module_marker = "never"
entry_names = "micromark.cjs"
[[delivery.also]]
name = "browser"
format = "iife"
entries = ["browser"]
exports = "default"
global = "micromark"
global_binding = "property"
entry_names = "micromark.umd.js"
[[delivery.also]]
name = "stream"
entries = ["stream"]
entry_names = "micromark.stream.js"
[[delivery.also]]
name = "stream-cjs"
format = "cjs"
entries = ["stream"]
es_module_marker = "never"
entry_names = "micromark.stream.cjs"
[[delivery.also]]
name = "test"
entries = ["test"]
entry_names = "micromark.test.js"

[policy.resources]
logical_work = 2000000000

[execution]
jobs = 1
