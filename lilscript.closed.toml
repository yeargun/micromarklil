# closed lane: the same source under the conservative production policy.
# The old compiler renamed extern class keys here; this compiler keeps them
# in both lanes.
[javascript]
priority = "size-first"
optimization_level = 13
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
candidate_search = "production"

[mangle]
identifiers = true
properties = true
pool_strings = true
